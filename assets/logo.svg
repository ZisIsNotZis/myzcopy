<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40" role="img" aria-label="myzcopy">
  <title>myzcopy</title>
  <!-- Mark: a "Z" whose bars are split into RAID-style stripes;
       the faded segment is parity. -->
  <g fill="currentColor">
    <rect x="6" y="8" width="7" height="5"/>
    <rect x="15" y="8" width="7" height="5"/>
    <rect x="24" y="8" width="7" height="5"/>
    <rect x="6" y="27" width="7" height="5"/>
    <rect x="15" y="27" width="7" height="5" opacity="0.55"/>
    <rect x="24" y="27" width="7" height="5"/>
  </g>
  <path d="M27.5 13 L12.5 27" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="butt"/>
  <text x="46" y="27" fill="currentColor"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="22" font-weight="700" letter-spacing="-0.4">myzcopy</text>
</svg>
